<header><h1>🌸 えいごたんごチャレンジ 🌸</h1><div class="sub">見る・聞く・打つ！ 小学生向け英単語アプリ</div></header>
<div class="wrap">
<div class="tabs">
<button class="tab active" data-tab="study">📚 れんしゅう</button>
<button class="btn primary mode active" data-mode="hint">💡 ヒントあり</button>
<button class="btn secondary mode" data-mode="nohint">⭐ ヒントなし</button>
<button class="tab" data-tab="list">📝 たんごリスト</button>
</div>
<section id="study" class="panel">
<div class="modebar"></div>
<div id="textbookBadge" class="textbook-badge">📘 W英語</div><div class="progress" id="progress"></div>
<div class="quiz">
<div class="card" id="leftCard"></div>
</div>
<div class="actions"><button class="btn secondary" id="prev">← 前のたんご</button><button class="btn success" id="next">次のたんご →</button><button class="btn warn" id="shuffle">🔀 シャッフル</button><button class="btn pronounce" id="pronounce">🔊 発音</button></div>
<div class="tips">💡 コツ：<b>日本語と絵を見て → 発音を聞いて → ヒントを使いながらタイピング</b>しよう！</div>
</section>
<section id="list" class="panel" style="display:none">
<h2>📝 たんごリストを作ろう</h2>
<p>英語・日本語・絵（絵文字）を入力して「追加」できます。自分だけの単語帳にしよう！</p>
<div class="row" style="font-weight:900"><div>英語</div><div>日本語</div><div class="wide">絵（絵文字）</div><div>★</div><div></div></div>
<div id="rows"></div>
<div class="actions"><button class="btn primary" id="add">＋ たんごを追加</button><button class="btn secondary" id="export">💾 保存用データをコピー</button><button class="btn secondary" id="import">📥 データを読み込む</button><button class="btn danger" id="reset">初期データに戻す</button></div>
<p class="small">保存用データはJSON形式。家のPCなど別の端末でも使いたいときに便利です。</p>
</section>
<div class="footer-note">このアプリはブラウザだけで動きます。音声は端末の音声機能を使います。</div>
</div>

function mergeWordLists(defaults,saved){
  if(!Array.isArray(saved)) return defaults.map(x=>({...x}));
  const byEn=new Map(saved.map(x=>[String(x.en).toLowerCase(),x]));
  const merged=defaults.map(d=>{
    const s=byEn.get(String(d.en).toLowerCase());
    return s ? {...d,...s} : {...d};
  });
  const defaultKeys=new Set(defaults.map(x=>String(x.en).toLowerCase()));
  saved.forEach(s=>{ if(!defaultKeys.has(String(s.en).toLowerCase())) merged.push({...s}); });
  return merged;
}

function phonicsText(word){
  const parts=PHONICS_MAP[word] || word.toLowerCase().split('').filter(c=>/[a-z]/.test(c));
  return parts.join(' ');
}
function speakPhonics(word){
  if(!('speechSynthesis' in window)) return;
  const u=new SpeechSynthesisUtterance(phonicsText(word));
  u.lang='en-US'; u.rate=.72; speechSynthesis.speak(u);
}
function speakThreeTimes(text, boxes){
  if(!('speechSynthesis' in window)){ boxes.forEach(b=>b.disabled=false); if(boxes[0]) boxes[0].focus(); return; }
  boxes.forEach(b=>b.disabled=true); speechSynthesis.cancel();
  const p=new SpeechSynthesisUtterance(phonicsText(text)); p.lang='en-US'; p.rate=.72;
  p.onend=()=>{
    boxes.forEach(b=>b.disabled=false); if(boxes[0]) boxes[0].focus();
    const a=new SpeechSynthesisUtterance(text); a.lang='en-US'; a.rate=.82;
    a.onend=()=>{ const b=new SpeechSynthesisUtterance(text); b.lang='en-US'; b.rate=.82; speechSynthesis.speak(b); };
    speechSynthesis.speak(a);
  };
  speechSynthesis.speak(p);
}

function phonicsCue(word){
  return PHONICS_OVERRIDES[word] || word.toLowerCase().split('').join(' ');
}
function speakOne(text, rate=.78, lang='en-US', onend=null){
  if(!('speechSynthesis' in window)){ if(onend) onend(); return; }
  const u=new SpeechSynthesisUtterance(text); u.lang=lang; u.rate=rate; if(onend) u.onend=onend; speechSynthesis.speak(u);
}
function speakTwiceAndUnlock(text, boxes){
  boxes.forEach(b=>b.disabled=true);
  if(!('speechSynthesis' in window)){ boxes.forEach(b=>b.disabled=false); if(boxes[0]) boxes[0].focus(); return; }
  speechSynthesis.cancel();
  // 1st: phonics. Unlock typing immediately after phonics finishes.
  const cue=phonicsCue(text);
  speakOne(cue,.68,'en-US',()=>{
    boxes.forEach(b=>b.disabled=false);
    if(boxes[0]) boxes[0].focus();
    // 2nd: normal word pronunciation
    speakOne(text,.82,'en-US',()=>{
      // 3rd: normal word pronunciation again
      speakOne(text,.82,'en-US');
    });
  });
}
function save(){localStorage.setItem(SAVED_WORDS_KEY,JSON.stringify(words));}
function current(){return words[idx]||words[0];}
function textbookForIndex(i){
  let wagonIndex=words.findIndex(w=>w.en.toLowerCase()==='wagon');
  let lightIndex=words.findIndex(w=>w.en.toLowerCase()==='light');
  let boundaryOpen=-1;
  if(lightIndex>=0){
    boundaryOpen=words.findIndex((w,n)=>n>lightIndex && w.en.toLowerCase()==='open');
  }
  if(wagonIndex>=0 && boundaryOpen>=wagonIndex && i>=wagonIndex && i<=boundaryOpen) return 'W';
  return 'J';
}
function makeLetters(word){
  const a=word.toLowerCase().split('');
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function renderStudy(){
 if(!words.length){$('#leftCard').innerHTML='<div class="empty">たんごがありません。<br>「たんごリスト」から追加してね。</div>';$('#progress').textContent='';return;}
 const w=current();
 const tb=textbookForIndex(idx);
 const badge=$('#textbookBadge');
 if(badge){badge.textContent=tb==='W'?'📘 W英語':'📗 J英語';badge.className='textbook-badge'+(tb==='J'?' j':'');}
 $('#progress').textContent=`${idx+1} / ${words.length} たんご　　★ ${w.stars||0}`;
 const left=$('#leftCard'); left.innerHTML='';
 const fullChars=w.en.toLowerCase().split('');
 const letters=fullChars.filter(ch=>/[a-z]/.test(ch));
 let alphaPos=0;
 const displayCells=fullChars.map(ch=>/[a-z]/.test(ch)
   ? `<input class="letterbox" maxlength="1" data-pos="${alphaPos++}" inputmode="latin" autocomplete="off" spellcheck="false" />`
   : `<span class="autoch">${ch===' ' ? '&nbsp;' : esc(ch)}</span>`).join('');
 left.innerHTML=`<div class="prompt">日本語と絵を見て、英語をタイピングしてみよう！</div><div class="big">${emojiOrFlag(w.emoji)}</div><div class="jp">${esc(w.jp)}</div><div class="letterboxes" id="letterboxes">${displayCells}</div><div class="actions"><button class="btn secondary" id="clearBtn">↶ けす</button></div><div id="letterbank" class="letterbank"></div><div id="hintnote" class="hintnote"></div><div id="feedback" class="feedback"></div>`;
 const boxes=[...document.querySelectorAll('.letterbox')];
 let solved=false;
 const bank=$('#letterbank');
 const hintnote=$('#hintnote');
 const feedback=$('#feedback');
 const getExpected=i=>letters[i]||'';
 if(practiceMode==='hint'){ hintnote.textContent='💡 正解の単語の文字だけがランダムに出るよ。'; }else{ $('#letterbank').style.display='none'; hintnote.textContent='⭐ ヒントなしで挑戦しよう！'; }
 const markWrong=box=>{box.style.background='#fff0f4';box.style.borderColor='#e65777';feedback.textContent='❌ ちがうよ！';feedback.className='feedback bad';};
 const markRight=box=>{box.style.background='#e9fff3';box.style.borderColor='#69d59b';feedback.textContent='⭕ あってるよ！';feedback.className='feedback good';};
 const consumeHintChar=ch=>{
   const btn=[...bank.querySelectorAll('.letterbtn')].find(b=>b.dataset.ch===ch);
   if(btn) btn.remove();
 };
 const restoreHintChar=ch=>{
   if(practiceMode!=='hint' || bank.style.display==='none' || !ch)return;
   const b=document.createElement('button');
   b.className='letterbtn';
   b.textContent=ch;
   b.dataset.ch=ch;
   b.dataset.n=String(bank.querySelectorAll('.letterbtn').length);
   b.onclick=()=>{const next=boxes.findIndex(x=>!x.value); if(next>=0)fillBox(next,ch,b);};
   bank.appendChild(b);
 };
 const fillBox=(i,ch,sourceButton=null)=>{
   if(i>=boxes.length)return;
   ch=String(ch).toLowerCase().replace(/[^a-z]/g,'').slice(0,1); if(!ch)return;
   const box=boxes[i]; box.value=ch;
   if(ch===getExpected(i)){
     if(sourceButton)sourceButton.remove(); else if(practiceMode==='hint' && bank.style.display!=='none')consumeHintChar(ch);
     markRight(box);
     if(i===boxes.length-1)checkBoxes(); else boxes[i+1].focus();
   }else{ markWrong(box); box.focus(); }
 };
 boxes.forEach((box,i)=>box.addEventListener('input',()=>{
   const ch=box.value.replace(/[^a-zA-Z]/g,'').slice(0,1).toLowerCase(); box.value=ch; if(!ch)return;
   if(ch===getExpected(i)){
     if(practiceMode==='hint' && bank.style.display!=='none')consumeHintChar(ch);
     markRight(box); if(i===boxes.length-1)checkBoxes(); else boxes[i+1].focus();
   }else{ markWrong(box); box.focus(); }
 }));
 boxes.forEach((box,i)=>box.addEventListener('keydown',e=>{
   if(e.key==='Backspace'){
     e.preventDefault();
     if(box.value){
       const old=box.value.toLowerCase();
       const expected=getExpected(i);
       box.value='';
       box.style.background='#fff';
       box.style.borderColor='#dfe7ff';
       if(practiceMode==='hint' && old===expected) restoreHintChar(old);
       feedback.textContent='';
       feedback.className='feedback';
       box.focus();
     }else if(i>0){
       boxes[i-1].focus();
     }
   }
 }));
 const renderHintBank=()=>{
   bank.style.display='flex'; bank.innerHTML='';
   makeLetters(w.en.replace(/[^a-zA-Z]/g,'')).forEach((ch,n)=>{const b=document.createElement('button'); b.className='letterbtn'; b.textContent=ch; b.dataset.ch=ch; b.dataset.n=n; b.onclick=()=>{const next=boxes.findIndex(x=>!x.value); if(next>=0)fillBox(next,ch,b);}; bank.appendChild(b);});
 };
 if(practiceMode==='hint'){
   renderHintBank();
 }
 $('#clearBtn').onclick=()=>{
   let target=-1;
   for(let i=boxes.length-1;i>=0;i--){ if(boxes[i].value){ target=i; break; } }
   if(target<0){ boxes[0].focus(); return; }
   const box=boxes[target];
   const old=box.value.toLowerCase();
   const expected=getExpected(target);
   box.value='';
   box.style.background='#fff';
   box.style.borderColor='#dfe7ff';
   if(practiceMode==='hint' && old===expected) restoreHintChar(old);
   feedback.textContent='';
   feedback.className='feedback';
   box.focus();
 };
 setTimeout(()=>speakThreeTimes(w.en, boxes),80);
}
function checkBoxes(){
 const w=current(); const boxes=[...document.querySelectorAll('.letterbox')]; const val=boxes.map(b=>b.value).join('').toLowerCase();
 const expected=w.en.toLowerCase().replace(/[^a-z]/g,''); const fb=$('#feedback'); if(!fb)return;
 if(val===expected){
   solved=true;
   fb.textContent='🎉 せいかい！ Enterでつぎのたんごへ';fb.className='feedback good';w.stars=(w.stars||0)+1;save();boxes.forEach(b=>{b.style.background='#e9fff3';b.style.borderColor='#69d59b'});const bank=$('#letterbank');if(bank)bank.style.display='none';
 }else if(val.length===expected.length){
   solved=false;
   fb.textContent='❌ ちがうよ！ 赤い文字をなおしてみよう。';fb.className='feedback bad';
   boxes.forEach((b,i)=>{b.style.background=b.value===expected[i]?'#e9fff3':'#fff0f4';b.style.borderColor=b.value===expected[i]?'#69d59b':'#e65777'});
 }
}
function renderRows(){const box=$('#rows');box.innerHTML='';if(!words.length){box.innerHTML='<div class="empty">まだたんごがないよ。</div>';return}words.forEach((w,i)=>{const r=document.createElement('div');r.className='row';r.innerHTML=`<input value="${esc(w.en)}" data-i="${i}" data-k="en"><input value="${esc(w.jp)}" data-i="${i}" data-k="jp"><input class="wide" value="${esc(w.emoji)}" data-i="${i}" data-k="emoji"><div class="count">★ ${w.stars||0}</div><button class="btn danger delete" data-del="${i}">削除</button>`;box.appendChild(r)});box.querySelectorAll('input').forEach(inp=>inp.addEventListener('change',()=>{words[+inp.dataset.i][inp.dataset.k]=inp.value;save();renderStudy()}));box.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{words.splice(+b.dataset.del,1);if(idx>=words.length)idx=Math.max(0,words.length-1);save();renderRows();renderStudy()})}
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
$('#add').onclick=()=>{words.push({en:'newword',jp:'日本語',emoji:'✨',stars:0});idx=words.length-1;save();renderRows();renderStudy()};
$('#reset').onclick=()=>{if(confirm('初期データに戻しますか？')){words=DEFAULT_WORDS.map(x=>({...x}));idx=0;save();renderRows();renderStudy()}};
$('#export').onclick=async()=>{const text=JSON.stringify(words,null,2);try{await navigator.clipboard.writeText(text);alert('保存用データをコピーしました！')}catch{prompt('このデータをコピーして保存してください',text)}};
$('#import').onclick=()=>{const text=prompt('JSONデータを貼り付けてください');if(!text)return;try{const data=JSON.parse(text);if(!Array.isArray(data))throw Error();words=data.map(x=>({en:String(x.en||''),jp:String(x.jp||''),emoji:String(x.emoji||'✨'),stars:Number(x.stars||0)})).filter(x=>x.en&&x.jp);idx=0;save();renderRows();renderStudy();alert('読み込みました！')}catch{alert('データの形式が正しくありません。')}};
$('#next').onclick=()=>{idx=(idx+1)%words.length;renderStudy()};$('#prev').onclick=()=>{idx=(idx-1+words.length)%words.length;renderStudy()};$('#shuffle').onclick=()=>{idx=Math.floor(Math.random()*words.length);renderStudy()};$('#pronounce').onclick=()=>speak(current().en);
document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{practiceMode=b.dataset.mode;document.querySelectorAll('.mode').forEach(x=>{x.classList.toggle('active',x.dataset.mode===practiceMode);x.classList.toggle('primary',x.dataset.mode===practiceMode);x.classList.toggle('secondary',x.dataset.mode!==practiceMode)});renderStudy();});
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');const t=b.dataset.tab;$('#study').style.display=t==='study'?'block':'none';$('#list').style.display=t==='list'?'block':'none';if(t==='list')renderRows()});
document.addEventListener('keydown',e=>{if(e.key==='Enter' && solved && $('#study').style.display!=='none'){e.preventDefault();idx=(idx+1)%words.length;renderStudy();}});
renderStudy();
</script>
